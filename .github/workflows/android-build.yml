name: Build Android APK

# Push / PR par auto-run hoga, aur Actions tab se manually bhi chala sakte ho
# (workflow_dispatch) — wahan flavor choose kar sakte ho: light (default, ~10-15MB)
# ya fullPython (Chaquopy + numpy/pandas/matplotlib, 80MB+).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor"
        required: true
        default: "light"
        type: choice
        options:
          - light
          - fullPython

permissions:
  contents: read

jobs:
  # Primary deliverable: the installable APK. Independent of the unit-test job
  # so a test failure never blocks getting an APK artifact.
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_LOG: ${{ runner.temp }}/gradle-output.log

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ubuntu-latest par Android SDK pehle se hota hai, lekin compileSdk 35
      # ke liye platform + build-tools pakka install kar lete hain.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Push/PR events par inputs.flavor khali hota hai -> default "light".
      # fullPython select karne par Chaquopy plugin app/build.gradle.kts
      # ke logic se apne-aap apply ho jata hai (task name me "fullPython" hai).
      - name: Determine flavor and Gradle tasks
        id: flavor
        env:
          INPUT_FLAVOR: ${{ inputs.flavor }}
        run: |
          FLAVOR="${INPUT_FLAVOR:-light}"
          if [ "$FLAVOR" = "fullPython" ]; then
            echo "task=assembleFullPythonDebug" >> "$GITHUB_OUTPUT"
            echo "apk_glob=app/build/outputs/apk/fullPython/debug/*.apk" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleLightDebug" >> "$GITHUB_OUTPUT"
            echo "apk_glob=app/build/outputs/apk/light/debug/*.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "Building flavor: $FLAVOR"

      - name: Build with Gradle
        id: gradle
        continue-on-error: true
        run: ./gradlew ${{ steps.flavor.outputs.task }} --stacktrace 2>&1 | tee "$GRADLE_LOG"

      - name: Report Gradle errors
        if: steps.gradle.outcome == 'failure'
        run: python3 .github/scripts/report_gradle_errors.py "$GRADLE_LOG"

      - name: Fail build on Gradle error
        if: steps.gradle.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed — see annotations above."
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-AI-${{ steps.flavor.outputs.flavor }}-Debug-APK
          path: ${{ steps.flavor.outputs.apk_glob }}
          if-no-files-found: error
          retention-days: 30

  # Unit tests run in their own job so their failure is clearly separated from
  # the APK build, and the actual failing assertions surface as annotations.
  test:
    runs-on: ubuntu-latest

    env:
      GRADLE_LOG: ${{ runner.temp }}/gradle-test.log

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew testLightDebugUnitTest --continue --stacktrace 2>&1 | tee "$GRADLE_LOG"

      # Compile errors (Kotlin/Gradle) come first: they mean no test ever ran.
      - name: Report Gradle errors
        if: steps.unit_tests.outcome == 'failure'
        run: python3 .github/scripts/report_gradle_errors.py "$GRADLE_LOG"

      # Turn every failing test into a GitHub ::error:: annotation with the
      # assertion message, so failures are readable without downloading logs.
      - name: Report unit test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/**/*.xml", recursive=True)
          if not files:
              print("::warning::No JUnit XML reports found under app/build/test-results")
              raise SystemExit(0)

          failures = 0
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  print(f"::warning::Could not parse {path}: {exc}")
                  continue
              for case in root.iter("testcase"):
                  problems = list(case.findall("failure")) + list(case.findall("error"))
                  for problem in problems:
                      failures += 1
                      name = f"{case.get('classname')}.{case.get('name')}"
                      message = (problem.get("message") or problem.text or "").strip()
                      message = " ".join(message.split())[:900]
                      print(f"::error title=FAILED {name}::{message}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"### Unit test failures: {failures}\n")
          print(f"Total failing test cases: {failures}")
          PY

      - name: Fail job if tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed — see annotations above for the exact cause."
          exit 1

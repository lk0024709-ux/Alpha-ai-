name: Build Android APK

# Push / PR par auto-run hoga, aur Actions tab se manually bhi chala sakte ho
# (workflow_dispatch) — wahan flavor choose kar sakte ho: light (default, ~10-15MB)
# ya fullPython (Chaquopy + numpy/pandas/matplotlib, 80MB+).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor"
        required: true
        default: "light"
        type: choice
        options:
          - light
          - fullPython

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ubuntu-latest par Android SDK pehle se hota hai, lekin compileSdk 35
      # ke liye platform + build-tools pakka install kar lete hain.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Push/PR events par inputs.flavor khali hota hai -> default "light".
      # fullPython select karne par Chaquopy plugin app/build.gradle.kts
      # ke logic se apne-aap apply ho jata hai (task name me "fullPython" hai).
      - name: Determine flavor and Gradle tasks
        id: flavor
        env:
          INPUT_FLAVOR: ${{ inputs.flavor }}
        run: |
          FLAVOR="${INPUT_FLAVOR:-light}"
          if [ "$FLAVOR" = "fullPython" ]; then
            echo "task=assembleFullPythonDebug" >> "$GITHUB_OUTPUT"
            echo "test_task=testFullPythonDebugUnitTest" >> "$GITHUB_OUTPUT"
            echo "apk_glob=app/build/outputs/apk/fullPython/debug/*.apk" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleLightDebug" >> "$GITHUB_OUTPUT"
            echo "test_task=testLightDebugUnitTest" >> "$GITHUB_OUTPUT"
            echo "apk_glob=app/build/outputs/apk/light/debug/*.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "Building flavor: $FLAVOR"

      - name: Run unit tests
        run: ./gradlew ${{ steps.flavor.outputs.test_task }}

      - name: Build with Gradle
        run: ./gradlew ${{ steps.flavor.outputs.task }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-AI-${{ steps.flavor.outputs.flavor }}-Debug-APK
          path: ${{ steps.flavor.outputs.apk_glob }}
          if-no-files-found: error
          retention-days: 30
